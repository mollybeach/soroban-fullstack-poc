name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/basic-storage

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Full gate (fmt, clippy, tests, WASM, Next build)
        run: make ci

  coverage:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js (export-coverage-summary.mjs)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/basic-storage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: LLVM tools (coverage instrumentation)
        run: rustup component add llvm-tools-preview

      - name: LLVM coverage (HTML + LCOV + frontend summary JSON)
        run: make contract-coverage

      - name: Upload coverage HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-cov-html
          path: contracts/basic-storage/target/llvm-cov-html/html
          if-no-files-found: warn

      - name: Upload LCOV
        uses: actions/upload-artifact@v4
        with:
          name: llvm-cov-lcov
          path: contracts/basic-storage/target/llvm-cov.lcov
          if-no-files-found: warn

      - name: Upload coverage summary for demos
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary-json
          path: frontend/public/coverage-summary.json
          if-no-files-found: warn
