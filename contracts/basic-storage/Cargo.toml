[package]
name = "basic-storage"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Required by `stellar contract build` (CLI v26+) for Soroban release wasm
[profile.release]
overflow-checks = true

[dependencies]
soroban-sdk = "23.0.0"

[dev-dependencies]
soroban-sdk = { version = "23.0.0", features = ["testutils"] }
